<!DOCTYPE html>
<link rel="icon" sizes="180x180" href="../../../../images/b1s.png" type="image/png">
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>bones-security聊天室</title>
  <link rel="stylesheet" href="../../../../CSS/style.css">
  <style>
      #chat {
      height: 320px;
      border: 1px solid #3b2b66;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      background: radial-gradient(circle at top left,#26164a,#050011);
      margin-bottom: 0.5rem;
    }
    .msg {
      margin: 4px 0;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .self {
      text-align: right;
      background: rgba(123,104,238,0.16);
    }
    .peer {
      text-align: left;
      background: rgba(72,61,139,0.22);
    }
    .system {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.8;
    }
    .system span {
      color: #ffdd55;
    }
    #members {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }
    #inputRow {
      display: flex;
      gap: 0.5rem;
    }
    #messageInput {
      flex: 1;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #3b2b66;
      background: #0b051c;
      color: #eee;
    }
    #sendBtn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg,#7b68ee,#ff6ad5);
      color: #fff;
      cursor: pointer;
      min-width: 80px;
    }
    #sendBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>BONES SECURITY TECHNOLOGY</h1>
    <nav>
      <a href="https://www.bones-security.com/main/pages/mainpage/index.html">首頁</a>
      <a href="https://www.bones-security.com/main/pages/contact/index.html">聯絡我們</a>
    </nav>
  </header>
  
  <section class="hero2">
    <h2>加密聊天</h2>
    <p>我們打造保護你隱私的科技武器</p>
  </section>
  
  <div class="top-bar" id="roomInfo">尚未加入房間</div>
  <div id="members">在線成員：-</div>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="messageInput" placeholder="輸入訊息後按 Enter 或點送出" autocomplete="off">
    <button id="sendBtn" disabled>送出</button>
  </div>

  <!-- Firebase & CryptoJS -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    // ========= 1. 基本設定 & 進房 =========
    const firebaseConfig = {
      apiKey: "AIzaSyBktU0zTENYrhASjX0-9317jjeOY9KxTEE",
      authDomain: "test-chat-room-cd4a6.firebaseapp.com",
      databaseURL: "https://test-chat-room-cd4a6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "test-chat-room-cd4a6",
      storageBucket: "test-chat-room-cd4a6.appspot.com",
      messagingSenderId: "537961446878",
      appId: "1:537961446878:web:005751d2770817c0cdb14f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const roomId  = prompt("輸入房號（ex: 1234）");
    const roomKey = prompt("輸入房間密碼（訊息加密用，所有人要一樣）");
    const nickRaw = prompt("輸入你的綽號（顯示在聊天室內）") || "匿名";

    if (!roomId || !roomKey) {
      alert("房號與密碼必填");
    }

    const roomRef     = db.ref("groupRooms/" + roomId);
    const messagesRef = roomRef.child("messages");
    const membersRef  = roomRef.child("members");

    // 用 sessionStorage 讓同一裝置重新整理算同一個 uid
    let uid = sessionStorage.getItem("bones_chat_uid");
    if (!uid) {
      uid = "u_" + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem("bones_chat_uid", uid);
    }

    const roomInfoEl = document.getElementById("roomInfo");
    const membersEl  = document.getElementById("members");
    const chatDiv    = document.getElementById("chat");
    const inputEl    = document.getElementById("messageInput");
    const sendBtn    = document.getElementById("sendBtn");

    roomInfoEl.textContent = `房號：${roomId}｜暱稱：${nickRaw}`;

    // 是否已被 destroy，用來避免重複顯示系統訊息
    let destroyed = false;

    // ========= 2. Emoji Encript =========
    function mulberry32(a) {
      return function() {
        a |= 0; a += 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function generateEmojis(seed) {
      const ranges = [
        [0x1F600,0x1F636],[0x1F300,0x1F320],
        [0x1F680,0x1F6A3],[0x2700,0x2752],
        [0x2600,0x2613]
      ];
      const base = [], sep = [], rng = mulberry32(seed);
      for (let [s,e] of ranges) {
        for (let cp=s; cp<=e; cp++) {
          if (!(cp<=0x1F||cp===0x7F||(cp>=0xFE00&&cp<=0xFE0F)||(cp>=0x200D&&cp<=0x200F))) {
            const ch = String.fromCodePoint(cp);
            (rng()<0.5 ? base : sep).push(ch);
          }
        }
      }
      return [base, sep];
    }
    function intToEmoji(code, base) {
      let out="", b=base.length;
      if (!code) return base[0];
      while (code>0) {
        out = base[code % b] + out;
        code = Math.floor(code / b);
      }
      return out;
    }
    function emojiEncode(txt, seed) {
      const [base, sep] = generateEmojis(seed);
      let out="";
      for (let i=0;i<txt.length;i++) {
        const cp = txt.codePointAt(i);
        out += intToEmoji(cp, base);
        if (i<txt.length-1) out += sep[Math.floor(Math.random()*sep.length)];
        if (cp>0xffff) i++;
      }
      return out;
    }
    function emojiDecode(emj, seed) {
      const [base, sep] = generateEmojis(seed);
      let res=[], tmp="";
      for (let ch of [...emj]) {
        if (sep.includes(ch)) {
          let v=0, i=0;
          while (i<tmp.length) {
            const c=[...tmp.slice(i)][0];
            v = v*base.length + base.indexOf(c);
            i += c.length;
          }
          res.push(String.fromCharCode(v));
          tmp="";
        } else tmp += ch;
      }
      if (tmp) {
        let v=0, i=0;
        while (i<tmp.length) {
          const c=[...tmp.slice(i)][0];
          v = v*base.length + base.indexOf(c);
          i += c.length;
        }
        res.push(String.fromCharCode(v));
      }
      return res.join("");
    }

    function emojiEncrypt(plain) {
      const aes = CryptoJS.AES.encrypt(plain, roomKey).toString(); // Base64
      const seed = CryptoJS.MD5(roomKey).words[0];
      return emojiEncode(aes, seed);
    }
    function emojiDecrypt(emj) {
      const seed = CryptoJS.MD5(roomKey).words[0];
      const b64  = emojiDecode(emj, seed);
      try {
        const dec = CryptoJS.AES.decrypt(b64, roomKey);
        return dec.toString(CryptoJS.enc.Utf8) || "(解密失敗)";
      } catch {
        return "(解密錯誤)";
      }
    }

    // ========= 3. UI 相關 =========
    function appendSystem(msg) {
      const el = document.createElement("div");
      el.className = "msg system";
      el.innerHTML = `<span>系統</span>：${msg}`;
      chatDiv.appendChild(el);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    function appendMsg(fromNick, text, self) {
      const el = document.createElement("div");
      el.className = "msg " + (self ? "self" : "peer");
      el.textContent = `${fromNick}：${text}`;
      chatDiv.appendChild(el);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // ========= 4. 成員在線狀態（nick 也加密） =========
    const encNick = emojiEncrypt(nickRaw);

    membersRef.child(uid).set({
      nick: encNick,
      joinedAt: firebase.database.ServerValue.TIMESTAMP
    });
    membersRef.child(uid).onDisconnect().remove();

    // 成員列表 & 空房處理（最後一人離開自動刪房）
    membersRef.on("value", snap => {
      if (!snap.exists()) {
        // 房間被清空（可能是最後一人離線，也可能是有人 !destroy!）
        if (!destroyed) {
          destroyed = true;
          // 這裡再呼叫一次 remove 保險，若已被刪除則是 no-op
          roomRef.remove().catch(err => console.error("刪除房間失敗：", err));
        }
        membersEl.textContent = "在線成員：-";
        if (!inputEl.disabled) {
          appendSystem("房間已無成員或被銷毀，伺服器已清除房間與訊息");
          inputEl.disabled = true;
          sendBtn.disabled  = true;
        }
        return;
      }

      const members = [];
      snap.forEach(ch => {
        const v = ch.val();
        if (v && v.nick) {
          const plain = emojiDecrypt(v.nick);
          members.push(plain || "無名");
        }
      });
      membersEl.textContent = "在線成員：" + (members.length ? members.join("、") : "-");
    });

    appendSystem("已加入房間，暱稱與訊息都以 Emoji 端到端加密");
    appendSystem("輸入 !destroy! 可手動銷毀房間（所有訊息與成員會被踢出）");

    // ========= 5. 收訊息 =========
    messagesRef.limitToLast(200).on("child_added", snap => {
      const msg = snap.val();
      if (!msg) return;
      const plainText = emojiDecrypt(msg.body);
      let fromNick = "";
      if (msg.fromNick) {
        fromNick = emojiDecrypt(msg.fromNick);
        if (!fromNick || fromNick.startsWith("(")) {
          fromNick = "未知用戶";
        }
      } else {
        fromNick = "未知用戶";
      }
      const isSelf = (msg.fromId === uid);
      appendMsg(fromNick, plainText, isSelf);
    });

    // ========= 6. 送訊息（含 !destroy! 指令） =========
    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      // --- 特殊指令：!destroy! ---
      if (text === "!destroy!") {
        const ok = confirm("⚠️ 確定要銷毀此房間？\n這會刪除所有訊息，並踢出所有成員。");
        inputEl.value = "";
        if (!ok) return;

        destroyed = true;
        roomRef.remove()
          .then(() => {
            membersEl.textContent = "在線成員：-";
            appendSystem("你已銷毀此房間，所有成員已被踢出。");
            inputEl.disabled = true;
            sendBtn.disabled  = true;
          })
          .catch(err => console.error("手動銷毀房間失敗：", err));
        return;
      }

      // --- 一般訊息 ---
      const cipherBody = emojiEncrypt(text);
      const cipherNick = encNick;

      messagesRef.push({
        fromId: uid,
        fromNick: cipherNick,
        body:    cipherBody,
        ts: firebase.database.ServerValue.TIMESTAMP
      });

      inputEl.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.disabled = false;
  </script>
</body>
</html>
