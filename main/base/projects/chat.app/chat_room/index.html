<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端對端加密聊天室 - Bones Security Technology</title>
  <link rel="icon" href="../../../../images/b1s.png" type="image/png">
  <link rel="stylesheet" href="../../../../CSS/style.css">
  <style>
    #chat {
      height: 380px;
      border: 1px solid var(--color-purple-neon);
      border-radius: 8px;
      padding: 1rem;
      overflow-y: auto;
      background: radial-gradient(circle at top left, #26164a, #050011);
      margin-bottom: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--color-purple-mid) var(--bg-main);
    }
    #chat::-webkit-scrollbar {
      width: 6px;
    }
    #chat::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    #chat::-webkit-scrollbar-thumb {
      background: var(--color-purple-dark);
      border-radius: 3px;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.5;
    }
    .self {
      margin-left: auto;
      text-align: left;
      background: rgba(123, 104, 238, 0.25);
      border-left: 3px solid var(--color-pink-neon);
      color: #fff;
    }
    .peer {
      margin-right: auto;
      text-align: left;
      background: rgba(72, 61, 139, 0.35);
      border-left: 3px solid var(--color-purple-mid);
      color: var(--color-text-bright);
    }
    .system {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
      margin: 12px auto;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      display: table;
      color: #aaa;
    }
    .system span {
      color: #ffdd55;
      font-weight: bold;
    }
    #members {
      font-size: 0.85rem;
      color: var(--color-purple-light);
      margin-bottom: 0.5rem;
      background-color: rgba(119, 0, 255, 0.05);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid rgba(119, 0, 255, 0.15);
    }
    #inputRow {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    #messageInput {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--color-purple-dark);
      background: #0b051c;
      color: #eee;
      font-family: var(--font-mono);
    }
    #messageInput:focus {
      border-color: var(--color-pink-neon);
      outline: none;
    }
    #sendBtn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #7b68ee, #ff6ad5);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      min-width: 90px;
      transition: all 0.2s ease;
      font-family: var(--font-mono);
    }
    #sendBtn:hover:not(:disabled) {
      box-shadow: 0 0 10px rgba(255, 106, 213, 0.5);
      transform: translateY(-1px);
    }
    #sendBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .top-bar {
      font-size: 0.9rem;
      background-color: #1a0f2b;
      border: 1px solid var(--color-purple-neon);
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      color: #fff;
      font-weight: bold;
    }
    .chat-layout {
      display: flex;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 2rem auto;
      align-items: stretch;
    }
    .chat-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .sidebar-panel {
      width: 320px;
      border: 1px solid var(--color-purple-neon);
      border-radius: 8px;
      padding: 1.25rem;
      background: radial-gradient(circle at bottom right, #11052c, #050011);
      color: #fff;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-panel h3 {
      font-size: 1rem;
      color: #fff;
      margin-top: 0;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid rgba(119, 0, 255, 0.2);
      padding-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-desc {
      font-size: 0.8rem;
      color: var(--color-text-bright);
      opacity: 0.7;
      line-height: 1.4;
      margin-top: 0;
      margin-bottom: 1.25rem;
    }
    .sidebar-label {
      font-size: 0.8rem;
      color: var(--color-purple-light);
      font-weight: bold;
      margin-bottom: 0.4rem;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sidebar-input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--color-purple-dark);
      background: #0b051c;
      color: #eee;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }
    .sidebar-input:focus {
      border-color: var(--color-pink-neon);
      outline: none;
    }
    .disconnect-btn {
      background: linear-gradient(135deg, #cc2e5d, #ff3c3c) !important;
    }
    @media (max-width: 768px) {
      .chat-layout {
        flex-direction: column;
      }
      .sidebar-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>BONES SECURITY TECHNOLOGY</h1>
    <nav>
      <a href="../../../../pages/mainpage/">首頁</a>
      <a href="../../../../pages/about/">關於</a>
      <a href="../../../../pages/projects/">作品</a>
      <a href="../../../../pages/services/">服務</a>
      <a href="../../../../pages/contact/">聯絡</a>
    </nav>
  </header>

  <main class="container" style="margin-top: 2rem;">
    <div class="chat-layout">
      <!-- Left Side: Chat Workspace -->
      <div class="chat-workspace">
        <div class="top-bar" id="roomInfo">⚡ 請在右側控制台設定安全連線...</div>
        <div id="members">在線成員：-</div>
        <div id="chat"></div>
        <div id="inputRow">
          <input id="messageInput" placeholder="請先完成右側安全連線..." autocomplete="off" aria-label="聊天訊息輸入框" disabled>
          <button id="sendBtn" disabled>送出</button>
        </div>
      </div>

      <!-- Right Side: Secure Console Sidebar -->
      <aside class="sidebar-panel">
        <h3>🔒 密鑰連線控制台</h3>
        <p class="sidebar-desc">在此配置您的端對端對稱加密通道，所有傳輸的封包將在本地端進行高強度加密後發送至去中心化資料同步節點。</p>

        <label class="sidebar-label" for="roomIdInput">房間群組 ID (Room ID)</label>
        <input class="sidebar-input" id="roomIdInput" type="text" placeholder="例如：1234" autocomplete="off">

        <label class="sidebar-label" for="roomKeyInput">端對端加密私鑰 (Password)</label>
        <input class="sidebar-input" id="roomKeyInput" type="password" placeholder="訊息對稱加密金鑰">

        <label class="sidebar-label" for="nicknameInput">通訊綽號 (Username)</label>
        <input class="sidebar-input" id="nicknameInput" type="text" placeholder="顯示於聊天室的暱稱" autocomplete="off">

        <button id="connectBtn" onclick="connectToRoom()" class="cta-button" style="width: 100%; margin-top: 0.5rem; margin-bottom: 0px;">
          建立加密連線
        </button>

        <button id="disconnectBtn" onclick="disconnectFromRoom()" class="cta-button disconnect-btn" style="width: 100%; margin-top: 0.5rem; margin-bottom: 0px; display: none;">
          斷開安全連線
        </button>
      </aside>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; margin-bottom: 2rem;">
      <a href="../" style="color: var(--color-purple-mid); text-decoration: none; font-size: 0.9rem;">&larr; 返回聊天室指引</a>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="copyright-year">2026</span> Bones Security Technology. All rights reserved.</p>
    <script>
      document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>
  </footer>

  <!-- Firebase & CryptoJS -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    // Firebase Configuration using correctly decoded keys
    const firebaseConfig = {
      apiKey: "AIzaSyBktU0zTENYrhASjX0-9317jjeOY9KxTEE",
      authDomain: "test-chat-room-cd4a6.firebaseapp.com",
      databaseURL: "https://test-chat-room-cd4a6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "test-chat-room-cd4a6",
      storageBucket: "test-chat-room-cd4a6.appspot.com",
      messagingSenderId: "537961446878",
      appId: "1:537961446878:web:005751d2770817c0cdb14f"
    };

    // Firebase App Singleton Initialization
    let app;
    if (firebase.apps.length === 0) {
      app = firebase.initializeApp(firebaseConfig);
    } else {
      app = firebase.app();
    }
    const db = firebase.database();

    // Responsive Connection State Machine
    let currentRoomId = null;
    let roomKey = null;
    let encNick = null;
    let roomRef = null;
    let messagesRef = null;
    let membersRef = null;
    let uid = null;
    let destroyed = false;

    // DOM Elements Cache
    const roomInfoEl = document.getElementById("roomInfo");
    const membersEl = document.getElementById("members");
    const chatDiv = document.getElementById("chat");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    // PRNG Algorithm (mulberry32)
    function mulberry32(a) {
      return function() {
        a |= 0;
        a += 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    // Dynamic Seed-Based Emoji Generation Table
    function generateEmojis(seed) {
      const ranges = [
        [0x1F600, 0x1F636],
        [0x1F300, 0x1F320],
        [0x1F680, 0x1F6A3],
        [0x2700, 0x2752],
        [0x2600, 0x2613]
      ];
      const base = [], sep = [];
      const rng = mulberry32(seed);
      for (let [s, e] of ranges) {
        for (let d = s; d <= e; d++) {
          if (!(d <= 0x1F || d === 0x7F || (d >= 0xFE00 && d <= 0xFE0F) || (d >= 0x200D && d <= 0x200F))) {
            const x = String.fromCodePoint(d);
            (rng() < 0.5 ? base : sep).push(x);
          }
        }
      }
      return [base, sep];
    }

    // Convert Integer Code Point to Base Emojis
    function intToEmoji(code, base) {
      let out = "", b = base.length;
      if (!code) return base[0];
      while (code > 0) {
        out = base[code % b] + out;
        code = Math.floor(code / b);
      }
      return out;
    }

    // Ciphertext to Emoji Encoder
    function emojiEncode(txt, seed) {
      const [base, sep] = generateEmojis(seed);
      let out = "";
      for (let i = 0; i < txt.length; i++) {
        const d = txt.codePointAt(i);
        out += intToEmoji(d, base);
        if (i < txt.length - 1) {
          out += sep[Math.floor(Math.random() * sep.length)];
        }
        if (d > 0xffff) i++;
      }
      return out;
    }

    // Emoji to Ciphertext Decoder
    function emojiDecode(emj, seed) {
      const [base, sep] = generateEmojis(seed);
      let res = [], q = "";
      for (let x of [...emj]) {
        if (sep.includes(x)) {
          let v = 0, i = 0;
          while (i < q.length) {
            const c = [...q.slice(i)][0];
            v = v * base.length + base.indexOf(c);
            i += c.length;
          }
          res.push(String.fromCodePoint(v));
          q = "";
        } else {
          q += x;
        }
      }
      if (q) {
        let v = 0, i = 0;
        while (i < q.length) {
          const c = [...q.slice(i)][0];
          v = v * base.length + base.indexOf(c);
          i += c.length;
        }
        res.push(String.fromCodePoint(v));
      }
      return res.join("");
    }

    // Cryptographic Emoji-AES Encryption Layer
    function emojiEncrypt(plainText) {
      const enc = CryptoJS.AES.encrypt(plainText, roomKey).toString();
      const j = CryptoJS.MD5(roomKey).words[0];
      return emojiEncode(enc, j);
    }

    // Cryptographic Emoji-AES Decryption Layer
    function emojiDecrypt(emj) {
      const j = CryptoJS.MD5(roomKey).words[0];
      const b64 = emojiDecode(emj, j);
      try {
        const dec = CryptoJS.AES.decrypt(b64, roomKey);
        return dec.toString(CryptoJS.enc.Utf8) || "(解密失敗)";
      } catch {
        return "(解密錯誤)";
      }
    }

    // UI Helper: Render System Message
    function appendSystem(msg) {
      const el = document.createElement("div");
      el.className = "msg system";
      el.innerHTML = `<span>系統</span>：${msg}`;
      chatDiv.appendChild(el);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // UI Helper: Render User Message
    function appendMsg(fromNick, text, isSelf) {
      const el = document.createElement("div");
      el.className = "msg " + (isSelf ? "self" : "peer");
      el.textContent = `${fromNick}：${text}`;
      chatDiv.appendChild(el);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // Connect to secure chat room
    function connectToRoom() {
      const roomIdInput = document.getElementById("roomIdInput").value.trim();
      const roomKeyInput = document.getElementById("roomKeyInput").value.trim();
      const nicknameInput = document.getElementById("nicknameInput").value.trim() || "匿名";

      if (!roomIdInput || !roomKeyInput) {
        alert("房間 ID 與加密私鑰為必填欄位！");
        return;
      }

      // Disable inputs to freeze configuration
      document.getElementById("roomIdInput").disabled = true;
      document.getElementById("roomKeyInput").disabled = true;
      document.getElementById("nicknameInput").disabled = true;

      // Lock Connection State
      currentRoomId = roomIdInput;
      roomKey = roomKeyInput;

      // Generate or retrieve Session UID
      uid = sessionStorage.getItem("bones_chat_uid");
      if (!uid) {
        uid = "u_" + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem("bones_chat_uid", uid);
      }

      // Encrypt nickname using room key
      encNick = emojiEncrypt(nicknameInput);

      // Setup Firebase references
      roomRef = db.ref("groupRooms/" + currentRoomId);
      messagesRef = roomRef.child("messages");
      membersRef = roomRef.child("members");

      // Reset and display connected state
      chatDiv.innerHTML = "";
      roomInfoEl.textContent = `房號：${currentRoomId}｜暱稱：${nicknameInput}`;

      // Join room by publishing member node
      membersRef.child(uid).set({
        nick: encNick,
        joinedAt: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        // Enable messaging interface
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.placeholder = "輸入訊息後按 Enter 或點送出";
        messageInput.focus();

        // Register disconnection presence removal
        membersRef.child(uid).onDisconnect().remove();

        // Listen for online members synchronization
        membersRef.on("value", snap => {
          if (!snap.exists()) {
            if (!destroyed) {
              destroyed = true;
              roomRef.remove().catch(err => console.error("刪除房間失敗：", err));
            }
            membersEl.textContent = "在線成員：-";
            if (!messageInput.disabled) {
              appendSystem("房間已無成員或被銷毀，伺服器已清除房間與訊息");
              messageInput.disabled = true;
              sendBtn.disabled = true;
            }
            return;
          }
          const nicks = [];
          snap.forEach(x => {
            const v = x.val();
            if (v && v.nick) {
              const dec = emojiDecrypt(v.nick);
              nicks.push(dec || "無名");
            }
          });
          membersEl.textContent = "在線成員：" + (nicks.length ? nicks.join("、") : "-");
        });

        // Listen for encrypted messages
        messagesRef.limitToLast(200).on("child_added", snap => {
          const msg = snap.val();
          if (!msg) return;
          const plainText = emojiDecrypt(msg.body);
          let fromNick = "";
          if (msg.fromNick) {
            fromNick = emojiDecrypt(msg.fromNick);
            if (!fromNick || fromNick.startsWith("(")) {
              fromNick = "未知用戶";
            }
          } else {
            fromNick = "未知用戶";
          }
          const isSelf = (msg.fromId === uid);
          appendMsg(fromNick, plainText, isSelf);
        });

        appendSystem("已成功建立去中心化安全連線，所有傳輸的封包皆以 Emoji 對稱端到端加密保護。");
        appendSystem("輸入 !destroy 可手動銷毀房間並強制踢出所有連線成員。");

        // Toggle state button display
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("disconnectBtn").style.display = "block";
      }).catch(err => {
        alert("連線建立失敗：" + err.message);
        disconnectFromRoom();
      });
    }

    // Disconnect and clean up session
    function disconnectFromRoom() {
      // Remove our member entry from database
      if (membersRef && uid) {
        membersRef.child(uid).remove();
      }

      // Turn off real-time listeners
      if (membersRef) membersRef.off();
      if (messagesRef) messagesRef.off();

      // Wipe workspace UI
      chatDiv.innerHTML = "";
      appendSystem("您已斷開安全連線。");
      roomInfoEl.textContent = "⚡ 請在右側控制台設定安全連線...";
      membersEl.textContent = "在線成員：-";

      // Reset state variables
      currentRoomId = null;
      roomKey = null;
      encNick = null;
      roomRef = null;
      messagesRef = null;
      membersRef = null;
      destroyed = false;

      // Re-enable and reset sidebar inputs
      document.getElementById("roomIdInput").disabled = false;
      document.getElementById("roomKeyInput").disabled = false;
      document.getElementById("nicknameInput").disabled = false;

      // Disable workspace input
      messageInput.disabled = true;
      sendBtn.disabled = true;
      messageInput.placeholder = "請先完成右側安全連線...";

      // Toggle state button display
      document.getElementById("connectBtn").style.display = "block";
      document.getElementById("disconnectBtn").style.display = "none";
    }

    // Message transmission execution
    function sendMessage() {
      if (!currentRoomId) return;
      const text = messageInput.value.trim();
      if (!text) return;

      if (text === "!destroy") {
        const ok = confirm("⚠️ 確定要手動銷毀此加密聊天室？\n這會清除波場通道內的所有歷史訊息，並將其餘在線成員全數斷線踢出。");
        messageInput.value = "";
        if (!ok) return;
        destroyed = true;
        roomRef.remove().then(() => {
          membersEl.textContent = "在線成員：-";
          appendSystem("您已手動銷毀此房間。");
          disconnectFromRoom();
        }).catch(err => console.error("手動銷毀房間失敗：", err));
        return;
      }

      const cipherBody = emojiEncrypt(text);
      const cipherNick = encNick;

      messagesRef.push({
        fromId: uid,
        fromNick: cipherNick,
        body: cipherBody,
        ts: firebase.database.ServerValue.TIMESTAMP
      });

      messageInput.value = "";
    }

    // Event Listeners Wire-up
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Clean up presence synchronously when window is closed/unloaded
    window.addEventListener("beforeunload", () => {
      if (membersRef && uid) {
        membersRef.child(uid).remove();
      }
    });
  </script>
</body>
