<!DOCTYPE html>
<link rel="icon" sizes="180x180" href="../../../../images/b1s.png" type="image/png">
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>bones-security聊天室</title>
  <link rel="stylesheet" href="../../../../CSS/style.css">
  <style>
      #chat {
      height: 320px;
      border: 1px solid #3b2b66;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      background: radial-gradient(circle at top left,#26164a,#050011);
      margin-bottom: 0.5rem;
    }
    .msg {
      margin: 4px 0;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .self {
      text-align: right;
      background: rgba(123,104,238,0.16);
    }
    .peer {
      text-align: left;
      background: rgba(72,61,139,0.22);
    }
    .system {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.8;
    }
    .system span {
      color: #ffdd55;
    }
    #members {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }
    #inputRow {
      display: flex;
      gap: 0.5rem;
    }
    #messageInput {
      flex: 1;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #3b2b66;
      background: #0b051c;
      color: #eee;
    }
    #sendBtn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg,#7b68ee,#ff6ad5);
      color: #fff;
      cursor: pointer;
      min-width: 80px;
    }
    #sendBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>BONES SECURITY TECHNOLOGY</h1>
    <nav>
      <a href="https://www.bones-security.com/main/pages/mainpage/index.html">首頁</a>
      <a href="https://www.bones-security.com/main/pages/contact/index.html">聯絡我們</a>
    </nav>
  </header>
  
  <section class="hero2">
    <h2>加密聊天</h2>
    <p>我們打造保護你隱私的科技武器</p>
  </section>
  
  <div class="top-bar" id="roomInfo">尚未加入房間</div>
  <div id="members">在線成員：-</div>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="messageInput" placeholder="輸入訊息後按 Enter 或點送出" autocomplete="off">
    <button id="sendBtn" disabled>送出</button>
  </div>

  <!-- Firebase & CryptoJS -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
