<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P 加密聊天</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
    #chat { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>P2P 加密聊天</h2>
  <div id="chat"></div>
  <input id="messageInput" placeholder="輸入訊息">
  <button onclick="sendMessage()">送出</button>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script>
    // Firebase 設定（請替換為你自己的）
    const firebaseConfig = {
      apiKey: "AIzaSyBktU0zTENYrhASjX0-9317jjeOY9KxTEE",
      authDomain: "test-chat-room-cd4a6.firebaseapp.com",
      databaseURL: "https://test-chat-room-cd4a6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "test-chat-room-cd4a6",
      storageBucket: "test-chat-room-cd4a6.firebasestorage.app",
      messagingSenderId: "537961446878",
      appId: "1:537961446878:web:005751d2770817c0cdb14f",
      measurementId: "G-W25R0SK9VQ"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const roomId = prompt("輸入聊天室代碼（兩人需相同）");
    const roomRef = db.ref("rooms/" + roomId);
    const chatDiv = document.getElementById("chat");

    let localConnection = new RTCPeerConnection();
    let dataChannel;
    let aesKey;

    function append(msg, isSelf) {
      const el = document.createElement("div");
      el.textContent = (isSelf ? "🟢 我：" : "🔵 對方：") + msg;
      chatDiv.appendChild(el);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function sendMessage() {
      const msg = document.getElementById("messageInput").value;
      encryptMessage(msg).then((enc) => {
        dataChannel.send(JSON.stringify(enc));
        append(msg, true);
      });
      document.getElementById("messageInput").value = '';
    }

    async function encryptMessage(msg) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(msg);
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoded);
      return { iv: Array.from(iv), data: Array.from(new Uint8Array(ciphertext)) };
    }

    async function decryptMessage(enc) {
      const iv = new Uint8Array(enc.iv);
      const data = new Uint8Array(enc.data);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, data);
      return new TextDecoder().decode(decrypted);
    }

    async function generateKey() {
      return await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    }

    async function exportKey(key) {
      const raw = await crypto.subtle.exportKey("raw", key);
      return btoa(String.fromCharCode(...new Uint8Array(raw)));
    }

    async function importKey(base64) {
      const raw = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
    }

    // === 主程式開始 ===
    roomRef.once("value", async snap => {
      if (snap.exists()) {
        // 已存在：加入者
        localConnection.ondatachannel = event => {
          dataChannel = event.channel;
          dataChannel.onmessage = async (e) => {
            const msg = await decryptMessage(JSON.parse(e.data));
            append(msg, false);
          };
        };

        const offer = (await roomRef.child("offer").get()).val();
        await localConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await localConnection.createAnswer();
        await localConnection.setLocalDescription(answer);
        roomRef.child("answer").set(answer);

        // 取得 AES 金鑰
        const aesBase64 = (await roomRef.child("aesKey").get()).val();
        aesKey = await importKey(aesBase64);

      } else {
        // 創建者
        dataChannel = localConnection.createDataChannel("chat");
        dataChannel.onmessage = async (e) => {
          const msg = await decryptMessage(JSON.parse(e.data));
          append(msg, false);
        };

        localConnection.onicecandidate = e => {
          if (e.candidate) return;
          roomRef.child("offer").set(localConnection.localDescription.toJSON());
        };

        aesKey = await generateKey();
        const aesBase64 = await exportKey(aesKey);
        roomRef.child("aesKey").set(aesBase64);

        const offer = await localConnection.createOffer();
        await localConnection.setLocalDescription(offer);

        roomRef.child("answer").on("value", async snap => {
          if (snap.exists()) {
            const answer = snap.val();
            await localConnection.setRemoteDescription(new RTCSessionDescription(answer));
          }
        });
      }
    });
  </script>
</body>
</html>
